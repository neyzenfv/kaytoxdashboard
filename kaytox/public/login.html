<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0c10">
  <title>KAYTOX</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    :root{color-scheme:dark;--bg:#0b0c10;--card:#151821;--surface:#1b202b;--border:#292f3c;--text:#f1f3f8;--muted:#929bad;--accent:#8b5cf6;--accent-hover:#9b70fb}
    *{box-sizing:border-box}
    body{display:grid;min-height:100vh;min-height:100dvh;margin:0;padding:24px;place-items:center;background:radial-gradient(ellipse at 50% 42%,#161326 0,transparent 58%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .login-card{width:min(100%,390px);padding:36px;border:1px solid var(--border);border-radius:20px;background:#151821eb;box-shadow:0 24px 80px #0005}
    .brand-mark{display:grid;width:42px;height:42px;margin:0 auto 20px;place-items:center;border:1px solid #8b5cf655;border-radius:13px;background:#8b5cf61a;color:#c4b5fd;font-size:17px;font-weight:750;letter-spacing:.02em}
    h1{margin:0;text-align:center;font-size:19px;font-weight:750;letter-spacing:.18em}
    h1 b{color:#a78bfa}
    .intro{margin:8px 0 26px;color:var(--muted);text-align:center;font-size:13px}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    input,button{width:100%;height:46px;padding:0 13px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font:inherit}
    input{margin-bottom:11px;transition:border-color .18s ease,box-shadow .18s ease}
    input::placeholder{color:#778194}
    input:focus{border-color:#8b5cf688;outline:0;box-shadow:0 0 0 3px #8b5cf61a}
    button{border-color:var(--accent);background:var(--accent);font-weight:600;cursor:pointer;transition:background .18s ease,transform .18s ease}
    button:hover{border-color:var(--accent-hover);background:var(--accent-hover)}
    button:active{transform:translateY(1px)}
    button:focus-visible{outline:2px solid #c4b5fd;outline-offset:3px}
    #e{min-height:20px;margin:12px 0 0;color:#fca5a5;font-size:12px;text-align:center}
    @media(max-width:480px){body{padding:18px}.login-card{padding:28px 22px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <form id="f" class="login-card">
    <div class="brand-mark" aria-hidden="true">K</div>
    <h1>KAY<b>TOX</b></h1>
    <p class="intro">Accès à votre espace</p>
    <label class="sr-only" for="c">Code d’accès</label>
    <input id="c" type="password" placeholder="Code d’accès" autofocus autocomplete="current-password">
    <button>Entrer</button>
    <div id="e" role="status" aria-live="polite"></div>
  </form>
  <script>
    f.onsubmit=async e=>{e.preventDefault();const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:c.value})});
      if(r.ok)location.href="/";else e_.textContent=r.status==429?"Trop de tentatives, réessaie plus tard.":"Code incorrect."}
    const e_=document.getElementById("e");
  </script>
</body>
</html>
