<script>
/* Couche d'accès au serveur (remplace la base de claude.ai) */
(()=>{const cache=new Map(),subs=new Set();let started=false;
const notify=()=>subs.forEach(f=>f());
const api=(m,u,b)=>fetch(u,{method:m,headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined}).then(r=>{if(r.status===401){location.href="/login";throw 0}return r.json()});
const pull=async()=>{try{const l=await api("GET","/api/items");cache.clear();l.forEach(o=>cache.set(o.id,o));notify()}catch(e){}};
const mk=id=>({id,set:async d=>{cache.set(id,d);notify();await api("PUT","/api/items/"+id,d)},
 update:async d=>{const n={...(cache.get(id)||{}),...d};cache.set(id,n);notify();await api("PUT","/api/items/"+id,n)},
 delete:async()=>{cache.delete(id);notify();await api("DELETE","/api/items/"+id)}});
const col={doc:id=>mk(id||"i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
 onSnapshot(cb){const f=()=>cb({docs:[...cache.values()].map(o=>({id:o.id,data:()=>o}))});subs.add(f);
  if(!started){started=true;setInterval(pull,5000)}pull();return()=>subs.delete(f)}};
const assets={upload:async f=>{const r=await fetch("/api/upload",{method:"POST",headers:{"Content-Type":f.type},body:f});if(!r.ok)throw new Error("upload");return r.json()}};
window.claude={use:async n=>n==="db"?{collection:()=>col}:n==="assets"?assets:null};
if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");})();
</script>

/* ---------- dates automatiques ---------- */
function nextSunday(from){let d=from;while(pd(d).getDay()!==0)d=addD(d,1);return d}
function nextVideoDate(ch){
  const l=ofk("video",ch).map(v=>v.date).filter(Boolean).sort().pop();
  if(ch==="main")return l?addD(l,14):nextSunday(TODAY);
  if(l)return addD(l,14);
  const m=ofk("video","main").map(v=>v.date).filter(Boolean).sort()[0];
  return addD(m||nextSunday(TODAY),7);
}
function nextShortDate(ch){
  const l=ofk("short",ch).map(v=>v.date+" "+(v.time||"")).sort().pop();
  let d=l?addD(l.slice(0,10),0):addD(TODAY,-1),t=l?l.slice(11):"";
  for(let i=0;i<30;i++){const c=pd(d);
    for(const[w,h]of SLOTS[ch])if(c.getDay()===w&&(d>(l?l.slice(0,10):"")||(d===l?.slice(0,10)&&h>t))&&d>=TODAY)return[d,h];
    d=addD(d,1)}
  return[TODAY,"14:00"];
}

/* ---------- tâches du jour ---------- */
const logs=()=>new Set(items.filter(i=>i.k==="log"&&i.done).map(i=>i.date+"_"+i.key));
function tasksFor(d){
  const b=BUILTIN.map(([key,title,time,prio,grp])=>({key,title,time,prio,grp,built:1}));
  const c=ofk("task").filter(t=>t.rec==="daily"||t.date===d).map(t=>({key:t.id,id:t.id,title:t.title,time:t.time||"",prio:t.prio||2,grp:"Perso",notes:t.notes}));
  return[...b,...c].sort((a,b)=>(a.time||"99").localeCompare(b.time||"99")||a.prio-b.prio);
}
async function toggleTask(key,d){const id="log_"+d+"_"+key,e=get(id);
  if(e)await upd(id,{done:!e.done});else await col().doc(id).set({id,k:"log",date:d,key,done:true})}

/* ---------- calendrier ---------- */
function entries(d){
  const out=[];
  items.forEach(i=>{
    if(["video","short","social"].includes(i.k)&&i.date===d)out.push({t:i.time||"",l:i.title,ic:({video:"play",short:"film",social:"share"})[i.k],id:i.id});
    if(i.k==="task"&&i.rec!=="daily"&&i.date===d)out.push({t:i.time||"",l:i.title,ic:"task",id:i.id});
    if(i.k==="event"&&i.date&&d>=i.date){const a=pd(i.date),b=pd(d);
      if(i.date===d||(i.rec==="daily")||(i.rec==="weekly"&&a.getDay()===b.getDay())||(i.rec==="monthly"&&a.getDate()===b.getDate()))
        out.push({t:i.time||"",l:i.title+(i.end?" → "+i.end:""),ic:"calendar",id:i.id})}
  });
  return out.sort((a,b)=>a.t.localeCompare(b.t));
}

  return`<div class="row sp page-heading"><div><h1>Idées</h1></div><button class="btn pri" data-a="newidea">${icon("plus")}<span>Page</span></button></div>
  <div class="tabs">${cats.map(c=>`<button class="${ideaCat===c?"on":""}" data-a="icat" data-v="${c}">${c}</button>`).join("")}</div>
  <div class="grid idea-layout"><div class="idea-list">${list.map(i=>`<div class="it ${i.id===ideaSel?"selected":""}" data-a="isel" data-id="${i.id}"><div class="bd"><div class="ti">${esc(i.title||"Sans titre")}</div><span class="tag">${esc(i.cat)}</span></div></div>`).join("")||empty("Aucune page","bulb")}</div>
  <div>${sel?`<div class="row idea-editor-head"><input class="editor-title" id="i_t" value="${esc(sel.title)}" placeholder="Titre"><select id="i_c">${cats.slice(1).map(c=>`<option ${sel.cat===c?"selected":""}>${c}</option>`).join("")}</select><button class="btn dng" aria-label="Supprimer" title="Supprimer" data-a="del" data-id="${sel.id}">${icon("trash")}</button></div>
  <div class="row idea-editor-toolbar">${[["h2","H"],["h3","h"],["bold","<b>G</b>"],["italic","<i>I</i>"],["underline","<u>S</u>"],["insertUnorderedList",icon("list")],["insertOrderedList",icon("listOrdered")],["chk",icon("check")],["link",icon("link")],["img",icon("image")]].map(([c,l])=>`<button class="btn sm" aria-label="${c}" title="${c}" data-tool="${c}">${l}</button>`).join("")}</div>
  <div class="ed" id="ed" contenteditable="true">${clean(sel.html||"")}</div>`:'<div class="empty">Choisis ou crée une page</div>'}</div></div>`;
}};
function clean(h){const t=document.createElement("template");t.innerHTML=h;
  t.content.querySelectorAll("script,iframe,style,object,embed,form").forEach(e=>e.remove());
  t.content.querySelectorAll("*").forEach(e=>[...e.attributes].forEach(a=>{if(/^on/i.test(a.name)||(/^(href|src)$/i.test(a.name)&&/^\s*javascript:/i.test(a.value)))e.removeAttribute(a.name)}));
  return t.innerHTML}

function syncMobileTabHighlight(){
  const indicator=$("#nav .mobile-tab-highlight"),active=$("#nav button.on");
  if(!indicator||!active)return;
  const bounds=indicator.getBoundingClientRect(),tab=active.getBoundingClientRect();
  if(!bounds.width||!tab.width)return;
  indicator.style.setProperty("--tab-left",`${Math.max(0,tab.left-bounds.left)}px`);
  indicator.style.setProperty("--tab-right",`${Math.max(0,bounds.right-tab.right)}px`);
}
window.addEventListener("resize",syncMobileTabHighlight,{passive:true});

function render(){
  $("#app").classList.toggle("nav-collapsed",navCollapsed);
  const groups=[...new Set(PAGES.map(([, , ,group])=>group))];
  $("#nav").innerHTML=`<div class="logo"><span class="logo-mark">K</span><span class="logo-name">KAY<b>TOX</b></span></div><div class="mobile-tab-highlight" aria-hidden="true"></div>`+groups.map(group=>`<div class="nav-group"><div class="nav-group-title">${group}</div>${PAGES.filter(([, , ,g])=>g===group).map(([id,ic,l])=>`<button class="${page===id?"on":""}" aria-label="${l}" title="${l}" data-a="page" data-v="${id}">${icon(ic)}<span class="l">${l}</span></button>`).join("")}</div>`).join("");
  syncMobileTabHighlight();
  if(page==="ideas"&&$("#ed")?.contains(document.activeElement))return;
  if($("#dlg").open)return;
  const m=q.trim().toLowerCase();let h;
  const pageTitle=m?"Recherche":(PAGES.find(([id])=>id===page)?.[2]||"Accueil");
  if(m){const r=items.filter(i=>i.k!=="log"&&(i.title+" "+(i.notes||"")).toLowerCase().includes(m));
    h=`<div class="page-heading"><h1>Recherche</h1><div class="sub">${r.length} résultat(s)</div></div>`+(r.map(i=>`<div class="it search-result" data-a="${i.k==="idea"?"isel":"ed"}" data-id="${i.id}"><div class="bd"><div class="ti">${esc(i.title)}</div><span class="tag">${i.k}</span></div></div>`).join("")||empty("Aucun résultat","search"))}
  else h=page==="c1"?views.chan("main"):page==="c2"?views.chan("second"):views[page]();
  $("#main").innerHTML=`<div id="top"><div class="topbar-left"><button class="btn sidebar-toggle" data-a="collapse" aria-label="${navCollapsed?"Développer":"Réduire"} la navigation" title="${navCollapsed?"Développer":"Réduire"} la navigation" aria-expanded="${!navCollapsed}">${icon(navCollapsed?"panelOpen":"panelClose")}</button><div class="breadcrumb"><span>KAYTOX</span><span>/</span><strong>${pageTitle}</strong></div></div><div class="topbar-right"><label class="searchbox">${icon("search")}<input id="q" type="search" aria-label="Recherche globale" placeholder="Rechercher vidéos, idées, tâches…" value="${esc(q)}"></label></div></div>`+h;
  $("#q").oninput=e=>{q=e.target.value;render();const i=$("#q");i.focus();i.setSelectionRange(q.length,q.length)};
  wireEditor();
}
let sv;function wireEditor(){const e=$("#ed");if(!e)return;
  const go=()=>{clearTimeout(sv);sv=setTimeout(()=>{e.querySelectorAll("input[type=checkbox]").forEach(c=>c.checked?c.setAttribute("checked",""):c.removeAttribute("checked"));
    upd(ideaSel,{html:clean(e.innerHTML),title:$("#i_t").value,cat:$("#i_c").value})},700)};
  e.oninput=go;e.onchange=go;$("#i_t").oninput=go;$("#i_c").onchange=go;}

document.addEventListener("mousedown",e=>{if(e.target.closest("[data-tool]"))e.preventDefault()});
document.addEventListener("click",async e=>{
  const tl=e.target.closest("[data-tool]");
  if(tl){const c=tl.dataset.tool,ed=$("#ed");ed.focus();
    if(c==="h2"||c==="h3")document.execCommand("formatBlock",false,c);
    else if(c==="chk")document.execCommand("insertHTML",false,'<input type="checkbox"> ');
    else if(c==="link"){const u=prompt("Adresse du lien (https://…)");if(u&&/^https?:\/\//i.test(u))document.execCommand("createLink",false,u)}
    else if(c==="img"){const a=await claude.use("assets");if(!a){alert("Import d’images indisponible ici.");return}
      const f=document.createElement("input");f.type="file";f.accept="image/*";f.onchange=async()=>{try{const r=await a.upload(f.files[0]);ed.focus();document.execCommand("insertImage",false,r.url);ed.dispatchEvent(new Event("input"))}catch(x){alert("Échec de l’import")}};f.click()}
    else document.execCommand(c);
    ed.dispatchEvent(new Event("input"));return}
  const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,id=t.dataset.id,D=t.dataset;
  if(a==="tk")return;
  if(a==="collapse"){navCollapsed=!navCollapsed;render()}
  else if(a==="page"){page=D.v;q="";filt="all";render()}
  else if(a==="filt"){filt=D.v;render()}
  else if(a==="new")openEd(D.k,null,D.ch);
  else if(a==="ed"){const i=get(id);if(i)openEd(i.k,id,i.ch)}
  else if(a==="st"){const i=get(id),n=stepsOf(i.k).length;await upd(id,{step:Math.max(0,Math.min(n-1,i.step+ +D.d))})}
  else if(a==="dup"){const i=get(id);await save({...i,id:uid(),title:i.title+" (copie)",step:0,ord:Date.now()})}
  else if(a==="del"){if(confirm("Supprimer définitivement ?")){if(ideaSel===id)ideaSel=null;await col().doc(id).delete()}}
  else if(a==="mv"){const i=get(id),l=ofk(i.k,i.ch),x=l.findIndex(z=>z.id===id),y=x+ +D.d;
    if(l[y]){const o1=i.ord||0,o2=l[y].ord||0;await upd(id,{ord:o2===o1?o1+ +D.d:o2});await upd(l[y].id,{ord:o1===o2?o2-+D.d:o1})}}
  else if(a==="view"){view=D.v;render()}
  else if(a==="nav"){const n=+D.d;cur=view==="month"?ymd(new Date(pd(cur).getFullYear(),pd(cur).getMonth()+n,1)):addD(cur,n*(view==="week"?7:1));render()}
  else if(a==="today"){cur=TODAY;render()}
  else if(a==="pick"){cur=D.d;render()}
  else if(a==="icat"){ideaCat=D.v;render()}
  else if(a==="isel"){ideaSel=id;page="ideas";q="";render()}
  else if(a==="newidea"){const n={id:uid(),k:"idea",title:"Nouvelle page",cat:ideaCat==="Toutes"?"Divers":ideaCat,html:"",ord:Date.now()};ideaSel=n.id;await save(n)}
});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset?.a==="tk")toggleTask(t.dataset.key,t.dataset.date)});

(async()=>{
  const to=setTimeout(()=>{if(!loaded)$("#main").innerHTML='<div class="empty">Base de données injoignable pour l’instant…</div>'},10000);
  try{db=await claude.use("db")}catch(e){}
  if(!db){$("#main").innerHTML='<div class="empty">Ouvre cette page depuis ton compte claude.ai (connecté) pour activer la sauvegarde.</div>';return}
  col().onSnapshot(s=>{items=s.docs.map(d=>d.data());loaded=true;clearTimeout(to);render()},e=>{$("#main").innerHTML='<div class="empty">Erreur de synchronisation : '+esc(e.message||e.code)+'</div>'});
  render();
})();
</script></body></html>
